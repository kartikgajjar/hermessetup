[project]
name = "webmcp"
version = "0.1.0"
description = "Multi-site, multi-account browser-session MCP server (LinkedIn-MCP pattern, generalised)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2,<4",
    "patchright>=1.55,<2",
]

[project.scripts]
webmcp = "webmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webmcp"]
